version: '3.8'

# ==============================================================================
# JobOrbit 1,000,000+ Request/Day Production Stack
# Services: NGINX (Edge Cache) + Gunicorn Flask + PostgreSQL + Redis + Scraper
# ==============================================================================

services:
  # ── Edge Proxy & SSL Termination ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: joborbit_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
    networks:
      - joborbit_net

  # ── Horizontally Scalable Flask API ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joborbit_backend
    restart: always
    command: gunicorn --config gunicorn.conf.py app:create_app()
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://joborbit_user:joborbit_secure_pass_2026@postgres:5432/joborbit_db
      - CACHE_TYPE=RedisCache
      - CACHE_REDIS_URL=redis://redis:6379/1
      - RATELIMIT_STORAGE_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-joborbit_enterprise_secret_key_2026}
      - WEB_CONCURRENCY=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - joborbit_net

  # ── Dedicated Scraper & Task Worker ────────────────────────────────────────
  scraper_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joborbit_scraper_worker
    restart: always
    command: python scheduler.py
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://joborbit_user:joborbit_secure_pass_2026@postgres:5432/joborbit_db
      - CACHE_REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-joborbit_enterprise_secret_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - joborbit_net

  # ── In-Memory Cache & Session Store ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: joborbit_redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - joborbit_net

  # ── Enterprise PostgreSQL 16 ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: joborbit_postgres
    restart: always
    environment:
      POSTGRES_USER: joborbit_user
      POSTGRES_PASSWORD: joborbit_secure_pass_2026
      POSTGRES_DB: joborbit_db
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c min_wal_size=100MB
      -c max_wal_size=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joborbit_user -d joborbit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - joborbit_net

volumes:
  postgres_data:
  redis_data:
  nginx_cache:
  frontend_dist:

networks:
  joborbit_net:
    driver: bridge
